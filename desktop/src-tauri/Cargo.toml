[package]
name = "pixelote"
version = "4.4.0"
description = "Pixelote: conversor de imágenes por lotes"
edition = "2021"

[lib]
name = "pixelote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ejecutable lo más pequeño posible
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
